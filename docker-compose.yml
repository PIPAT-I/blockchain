version: '3.8'

services:
  node1:
    build: .
    container_name: node1
    command: python node_server.py --port 5001 --peers http://node2:5002,http://node3:5003,http://node4:5004
    ports:
      - "5001:5001"
    environment:
      - NODE_HOST=node1
    networks:
      - blockchain-net

  node2:
    build: .
    container_name: node2
    command: python node_server.py --port 5002 --peers http://node1:5001,http://node3:5003,http://node4:5004
    ports:
      - "5002:5002"
    depends_on:
      - node1
    environment:
      - NODE_HOST=node2
    networks:
      - blockchain-net

  node3:
    build: .
    container_name: node3
    command: python node_server.py --port 5003 --peers http://node1:5001,http://node2:5002,http://node4:5004
    ports:
      - "5003:5003"
    depends_on:
      - node1
      - node2
    environment:
      - NODE_HOST=node3
    networks:
      - blockchain-net

  node4:
    build: .
    container_name: node4
    command: python node_server.py --port 5004 --peers http://node1:5001,http://node2:5002,http://node3:5003
    ports:
      - "5004:5004"
    depends_on:
      - node1
      - node2
      - node3
    environment:
      - NODE_HOST=node4
    networks:
      - blockchain-net

networks:
  blockchain-net:
    driver: bridge
